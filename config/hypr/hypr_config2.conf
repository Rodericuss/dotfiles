################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
# monitor=HDMI-A-1,1920x1080@60,1080x700,1
# monitor=DP-1,1920x1080@60,0x0,1,transform,1

# Portable fallback; add per-monitor rules after `hyprctl monitors`.
monitor = ,preferred,auto,1
# Execute your favorite apps at launch
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = blueman-applet
exec-once = hyprpaper
exec-once = nm-applet --indicator
exec-once = swaync
exec-once = wl-paste --watch cliphist store
# Hyprland plugins are intentionally not auto-installed by this repository.
# exec-once = ~/scripts/cliphist_poll.sh


#############################
### ENVIRONMENT VARIABLES ###
#############################
env = XDG_SESSION_TYPE,wayland

env = XCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

exec = source ~/.profile


#####################
### LOOK AND FEEL ###
#####################

general {
     gaps_in = 0
     gaps_out = 0, 0, 0, 0

     border_size = 0

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors

    # col.active_border = 0xff434c5e
    col.active_border = rgba(ee5396ff)
    col.inactive_border= rgba(78a9ffff)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true
    hover_icon_on_border = true
    extend_border_grab_area = 10
    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
rounding = 50
rounding_power = 1.0

    # Change transparency of focused and unfocused windows
    active_opacity = 0.8     # Brightness of the focused window
        inactive_opacity = 0.8   # "Dimmer" look for unfocused windows
    shadow {
        enabled = true
        range = 5
        render_power = 10
    }
    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        enabled = true
        xray = true  # Floating windows won't blur other windows, only the wallpaper
        size = 5
        passes = 3
        vibrancy = 0.0          # Zere para manter as cores originais do wallpaper
        vibrancy_darkness = 1.0 # Força o blur a ser escuro
        brightness = 0.8        # Escurece um pouco o que está atrás da janela
        contrast = 1.0          # Mantém o contraste original
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = false

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more

cursor {
    no_hardware_cursors = false
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
# misc {
#     force_default_wallpaper = -2 # Set to 0 or 1 to disable the anime mascot wallpapers
#     disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
# }


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = br
    kb_variant = abnt2
    numlock_by_default = true
    # force_no_accel = true
    # follow_mouse = 1

    # sensitivity = 1.0 # -1.0 - 1.0, 0 means no modification.
    # accel_profile = flat
    # touchpad {
    #     natural_scroll = false
    # }
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures

binds {
    workspace_back_and_forth = true
}
# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more


layerrule = blur on, match:namespace kitty
layerrule = ignore_alpha 0.5, match:namespace kitty

windowrule = opacity 0.9 override, match:class neovide
windowrule = match:initial_title ^(Cliphist FZF)$, float on, size (monitor_w*0.8) (monitor_h*0.3), move (monitor_w*0.1) (monitor_h*0.65)

# Yazi
windowrulev = workspace special:yazi, class:^(yazi-(toggle|special))$
windowrulev = opacity 0.85 0.85, class:^(yazi-(toggle|special))$
windowrulev = blur, class:^(yazi-(toggle|special))$
workspace = special:yazi, on-created-empty:kitty --class=yazi-special -e yazi

# Discord
windowrulev = workspace special:discord, class:^(discord)$
workspace = special:discord, on-created-empty:discord

# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, C, exec, neovide
bind = $mainMod, Q, exec, kitty  #open the terminal
bind = $mainMod SHIFT, Q, exec, kitty  #open the terminal
bind = $mainMod, D, exec, firefox #open the terminal
bind = $mainMod, O, exec, kitty --title "Cliphist FZF" sh -c "$HOME/.local/bin/cliphist_fzf.sh"
bind = $mainMod, X, exec, sh -c '$HOME/.local/bin/dmenu_cliphist.sh add'
bind = , F7, exec, sh -c '~/.local/bin/f1_hypr_conf.sh'
bind = $mainMod SHIFT, W, exec, kill -9 $(hyprctl activewindow -j | jq .pid)
bind = $mainMod, W, killactive, # close the active window
bind = $mainMod SHIFT, C, centerwindow, # close the active window
bind = $mainMod SHIFT, V, resizeactive, exact 1000 600
# Keybind to toggle the special workspace
bind = $mainMod, E, togglespecialworkspace, yazi
bind = $mainMod, V, togglefloating, # Allow a window to float
bind = $mainMod, F, fullscreen, # toggle fullscreen as true for current window
bind = $mainMod SHIFT, F, fullscreen, 1 # toggle fullscreen as true for current window
bind = $mainMod, SPACE, exec, rofi -show drun # Show the graphical app launcher
bind = $mainMod, S, exec, grim -g "$(slurp)" - | swappy -f - # take a screenshot
# bind = $mainMod, G,
bind = $mainMod, A, togglespecialworkspace, discord  # Super + D for Discord

# Move focus with mainMod + arrow keys
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Media control
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioPause, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

# Volume
bind = , XF86AudioRaiseVolume, exec, ~/.config/hypr/scripts/volume --inc
bind = , XF86AudioLowerVolume, exec, ~/.config/hypr/scripts/volume --dec
bind = , XF86AudioMicMute, exec, ~/.config/hypr/scripts/volume --toggle-mic
bind = , XF86AudioMute, exec, ~/.config/hypr/scripts/volume --toggle

